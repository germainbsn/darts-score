<h1>Triple Vingt</h1>
<h2>Nouvelle partie — Cricket</h2>

<div class="field">
  <label>Joueurs</label>
  <div class="stepper">
    <button type="button" (click)="setPlayerCount(playerCount() - 1)">−</button>
    <span>{{ playerCount() }}</span>
    <button type="button" (click)="setPlayerCount(playerCount() + 1)">+</button>
  </div>
</div>

<div class="field">
  @for (name of names(); track $index) {
    <input
      type="text"
      [value]="name"
      [placeholder]="'Joueur ' + ($index + 1)"
      (input)="onNameInput($index, $any($event.target).value)"
    />
  }
</div>

<button type="button" class="btn" (click)="startGame()">Lancer la partie</button>
